<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mirage Bay</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23ff7a9d'/%3E%3C/svg%3E">
  <style>
    :root{--ink:#fff7df;--cyan:#62e7ed;--pink:#ff7a9d;--gold:#ffd36a}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#18324b;font-family:Georgia,"Times New Roman",serif}
    canvas{display:block;width:100%;height:100%;touch-action:none}
    #hud{position:absolute;inset:0;pointer-events:none;color:var(--ink);text-shadow:0 2px 8px #15253a}
    #title{position:absolute;inset:0;display:flex;align-items:flex-end;padding:7vh 7vw 9vh;background:linear-gradient(90deg,rgba(22,30,62,.82),transparent 55%)}
    #title.hidden{display:none}.brand{max-width:620px}.kicker{font:700 12px/1 Arial,sans-serif;letter-spacing:.42em;color:#ffd46d;text-transform:uppercase}
    h1{margin:.12em 0 .05em;font-size:clamp(64px,10vw,150px);line-height:.76;letter-spacing:-.065em;text-shadow:0 7px 30px #16254a}
    h1 em{display:block;font-size:.46em;letter-spacing:.08em;color:#77eef0;font-style:italic;margin-left:.55em}
    .subtitle{font:italic 20px Georgia;margin:18px 0 30px;color:#fff0ca}
    .menu{pointer-events:auto;display:flex;gap:10px}.menu button,#pause button{border:1px solid rgba(255,255,255,.45);background:rgba(20,43,69,.72);color:white;padding:13px 18px;font:700 12px Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
    .menu button.primary{background:var(--pink);border-color:#ffc2d0}.menu button:hover,#pause button:hover{filter:brightness(1.15)}
    #top{position:absolute;left:28px;top:24px;width:310px}.eyebrow{font:700 10px Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#ffd36a}
    #mission{margin-top:6px;font-size:20px;font-style:italic;line-height:1.15}
    #district{position:absolute;right:28px;top:25px;text-align:right;font:700 11px Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase}
    #wanted{margin-top:7px;color:#ffb2c5;font-size:23px;letter-spacing:.12em}
    #minimap{position:absolute;right:28px;bottom:38px;width:172px;height:172px;border:2px solid rgba(255,239,199,.75);border-radius:50%;overflow:hidden;background:rgba(17,39,67,.72);box-shadow:0 8px 25px rgba(14,28,58,.32)}
    #mapcanvas{width:100%;height:100%}.maplabel{position:absolute;bottom:8px;left:0;width:100%;text-align:center;font:700 9px Arial;letter-spacing:.18em}
    #speed{position:absolute;left:28px;bottom:34px;font-size:42px;font-weight:bold}.speedunit{display:block;font:700 9px Arial;letter-spacing:.22em;color:#62e7ed}
    #prompt{position:absolute;left:50%;bottom:35px;transform:translateX(-50%);border:1px solid rgba(255,255,255,.5);background:rgba(20,43,69,.82);padding:9px 13px;font:700 11px Arial;letter-spacing:.12em;text-transform:uppercase}
    #pause{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(12,28,49,.58);pointer-events:auto}#pause.show{display:flex}.pausecard{text-align:center;width:min(460px,80vw);border-top:1px solid #ffd36a;border-bottom:1px solid #ffd36a;padding:28px;background:rgba(18,39,66,.92)}
    #mute{position:absolute;right:218px;bottom:39px;pointer-events:auto;border:0;background:transparent;color:white;font-size:18px;cursor:pointer}
    #toast{position:absolute;left:50%;top:15%;transform:translateX(-50%) scale(.95);font:700 15px Arial;letter-spacing:.18em;text-transform:uppercase;opacity:0;transition:.3s}#toast.show{opacity:1;transform:translateX(-50%) scale(1)}
    #controls{position:absolute;left:28px;bottom:104px;display:flex;gap:12px;font:700 9px Arial;letter-spacing:.12em;text-transform:uppercase;color:#f9e7c2}
    #controls span{border-top:1px solid rgba(255,255,255,.5);padding-top:6px}.playing #title{display:none}.playing #top,.playing #district,.playing #minimap,.playing #speed,.playing #prompt,.playing #mute,.playing #controls,.playing #toast{display:block}.playing #mute{display:block}.playing #toast{display:block}
    body:not(.playing) #top,body:not(.playing) #district,body:not(.playing) #minimap,body:not(.playing) #speed,body:not(.playing) #prompt,body:not(.playing) #mute,body:not(.playing) #controls,body:not(.playing) #toast{display:none}
    #pressure{position:absolute;left:28px;top:104px;font:700 10px Arial;letter-spacing:.16em;text-transform:uppercase;color:#ffb0bf;display:none}
    .playing #pressure{display:block}
    @media(max-width:700px){#top{left:14px;top:14px;width:220px}#mission{font-size:16px}#minimap{width:130px;height:130px;right:14px}#speed{left:14px;bottom:18px}#mute{right:160px}}
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="title">
      <div class="brand"><div class="kicker">A neon noir city story</div><h1>MIRAGE<em>Bay</em></h1><div class="subtitle">One night. One coupe. A city in the rear-view.</div>
        <div class="menu"><button id="start" class="primary">New story</button><button id="continue">Continue</button></div>
      </div>
    </div>
    <div id="top"><div class="eyebrow">Night Run · Chapter One</div><div id="mission">Meet Sol at Palm Row</div></div>
    <div id="district"><span id="districtname">Palisade Avenue</span><div id="wanted">☆ ☆ ☆ ☆ ☆</div></div>
    <canvas id="minimap" width="172" height="172"></canvas>
    <div id="speed"><span id="speednum">0</span><span class="speedunit">KM/H</span></div>
    <button id="mute" aria-label="Mute">♪</button>
    <div id="controls"><span>WASD Move / Drive</span><span>E Enter / Exit</span><span>Q EMP</span><span>Shift Boost</span></div>
    <div id="pressure"></div>
    <div id="prompt"></div><div id="toast"></div>
    <div id="pause"><div class="pausecard"><div class="eyebrow">Mirage Bay</div><h2>Pause</h2><button id="resume">Resume</button></div></div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
